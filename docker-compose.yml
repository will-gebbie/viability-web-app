services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "${DEBUG:-False}" # dev sets DEBUG=True in .env; a host without it gets prod
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      SITE_URL: "${SITE_URL:-http://localhost:8000}"
      # Unset means the local container; override to point at a remote deployment.
      COUNTER_URL: "${COUNTER_URL:-http://counter:8001/count}"
      STRAIN_URL: "${STRAIN_URL:-http://strain:8003/strain_comp}"
      MICRO_URL: "${MICRO_URL:-http://microscopy:8002/micro}"
      SERVICE_TOKEN: "${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}"
      # How long the portal waits on each service; each service's GUNICORN_TIMEOUT
      # below is set higher so the service reports the failure first.
      COUNTER_TIMEOUT: "${COUNTER_TIMEOUT:-180}"
      STRAIN_TIMEOUT: "${STRAIN_TIMEOUT:-600}"
      MICRO_TIMEOUT: "${MICRO_TIMEOUT:-600}"
      # The portal's own gunicorn --timeout. Must stay above the largest of the
      # three waits above, or the worker dies before the service answers.
      GUNICORN_TIMEOUT: "${WEB_SERVER_TIMEOUT:-660}"
      SQLITE_PATH: "/data/db.sqlite3"
    volumes:
      - db:/data
    # Long-form with required:false so web can run alone against remote services
    # (no `local` profile); `--profile local` still starts these first for dev.
    depends_on:
      counter:
        condition: service_started
        required: false
      microscopy:
        condition: service_started
        required: false
      strain:
        condition: service_started
        required: false
    develop:
      watch:
        - action: sync+restart
          path: ./portal/
          target: /app/portal
          ignore:
            - __pycache__/
        - action: sync+restart
          path: ./config/
          target: /app/config
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./requirements.txt

  counter:
    profiles: [local]
    build:
      context: .
      dockerfile: counter/Dockerfile
    environment:
      SERVICE_TOKEN: "${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}"
      GUNICORN_TIMEOUT: "${COUNTER_SERVER_TIMEOUT:-300}"
      # Unset means host cores minus one — set it if you CPU-limit this container.
      COUNTER_THREADS: "${COUNTER_THREADS:-}"

  strain:
    profiles: [local]
    build:
      context: .
      dockerfile: strain_composition/Dockerfile
    environment:
      SERVICE_TOKEN: "${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}"
      GUNICORN_TIMEOUT: "${STRAIN_SERVER_TIMEOUT:-900}"
      STRAIN_THREADS: "${STRAIN_THREADS:-}"

  microscopy:
    profiles: [local]
    build:
      context: .
      dockerfile: microscopy/Dockerfile
    environment:
      MODEL_PATH: /model
      SERVICE_TOKEN: "${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}"
      GUNICORN_TIMEOUT: "${MICRO_SERVER_TIMEOUT:-900}"
    volumes:
      - "${CELLPOSE_MODEL:?set CELLPOSE_MODEL in .env}:/model:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  db:
