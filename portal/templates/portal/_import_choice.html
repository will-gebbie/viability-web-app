<div style="display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:20px;
            max-width:720px">
    <button type="button"
            class="card"
            hx-get="{% url 'portal:import-upload' %}"
            hx-target="#import-body"
            hx-swap="innerHTML"
            style="text-align:left;
                   cursor:pointer;
                   display:flex;
                   flex-direction:column;
                   gap:8px;
                   background:var(--panel);
                   border:1px solid var(--border);
                   border-radius:12px;
                   padding:26px;
                   box-shadow:var(--shadow);
                   font-family:Geist;
                   color:var(--text)">
        <span style="font-size:28px;line-height:1">⬆</span>
        <span style="font-size:16px;font-weight:600">Upload a template</span>
        <span style="font-size:12.5px;color:var(--text-2)">Download the template, fill it out, and upload the file.</span>
    </button>
    <button type="button"
            class="card"
            hx-get="{% url 'portal:import-manual' %}"
            hx-target="#import-body"
            hx-swap="innerHTML"
            style="text-align:left;
                   cursor:pointer;
                   display:flex;
                   flex-direction:column;
                   gap:8px;
                   background:var(--panel);
                   border:1px solid var(--border);
                   border-radius:12px;
                   padding:26px;
                   box-shadow:var(--shadow);
                   font-family:Geist;
                   color:var(--text)">
        <span style="font-size:28px;line-height:1">✎</span>
        <span style="font-size:16px;font-weight:600">Enter information manually</span>
        <span style="font-size:12.5px;color:var(--text-2)">Type the run details into a form field by field.</span>
    </button>
</div>
