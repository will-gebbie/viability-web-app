<div id="micro-form">
    {% if error %}
        <p style="max-width:520px;
                  margin:0 0 14px;
                  padding:10px 12px;
                  font-size:13px;
                  color:#fff;
                  background:#dc2626;
                  border-radius:8px">{{ error }}</p>
    {% endif %}
    <form method="post"
          enctype="multipart/form-data"
          hx-post="{% url 'portal:upload-micro' run.slug %}"
          hx-encoding="multipart/form-data"
          hx-target="#micro-form"
          hx-swap="outerHTML"
          hx-indicator="this"
          hx-disabled-elt="find button[type=submit]"
          style="display:flex;
                 flex-direction:column;
                 gap:16px;
                 max-width:520px;
                 background:var(--panel);
                 border:1px solid var(--border);
                 border-radius:12px;
                 padding:24px;
                 box-shadow:var(--shadow)">
        {% csrf_token %}
        {% if replace_id %}
            <input type="hidden" name="replace" value="{{ replace_id }}">
            <p style="margin:0;font-size:12.5px;color:var(--text-2)">Replacing an existing measurement — the old one is removed once this upload succeeds.</p>
        {% endif %}
        <label style="display:flex;
                      flex-direction:column;
                      gap:6px;
                      font-size:13px;
                      color:var(--text-2)">
            Images (TIF / JPG / PNG)
            {{ form.images }}
            {{ form.images.errors }}
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
            <label style="min-width:0;
                          display:flex;
                          flex-direction:column;
                          gap:6px;
                          font-size:13px;
                          color:var(--text-2)">
                OD
                {{ form.od }}
                {{ form.od.errors }}
            </label>
            <label style="min-width:0;
                          display:flex;
                          flex-direction:column;
                          gap:6px;
                          font-size:13px;
                          color:var(--text-2)">
                Date
                {{ form.micro_date }}
                {{ form.micro_date.errors }}
            </label>
        </div>
        <div style="display:flex;gap:10px">
            <button type="submit"
                    class="btn-accent"
                    style="display:inline-flex;
                           align-items:center;
                           gap:8px;
                           padding:10px 18px;
                           font-size:13.5px;
                           font-weight:600;
                           font-family:Geist;
                           color:#fff;
                           background:var(--accent);
                           border:none;
                           border-radius:9px;
                           cursor:pointer">
                <span class="spinner htmx-indicator"></span>Upload
            </button>
            <a href="{% url 'portal:overview' run.slug %}"
               class="btn-soft"
               style="padding:10px 18px;
                      font-size:13.5px;
                      color:var(--text-2);
                      background:var(--panel-2);
                      border:1px solid var(--border);
                      border-radius:9px">Cancel</a>
        </div>
    </form>
</div>
