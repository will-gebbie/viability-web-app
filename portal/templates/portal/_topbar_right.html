{# Shared top-bar controls: theme toggle + user chip (name, role, sign out). #}
<button onclick="toggleTheme()"
        title="Toggle theme"
        class="btn-soft"
        style="width:34px;
               height:34px;
               border-radius:8px;
               background:var(--panel-2);
               border:1px solid var(--border);
               color:var(--text-2);
               cursor:pointer;
               font-size:14px"><span data-theme-icon>☾</span></button>
<div style="display:flex;
            align-items:center;
            gap:9px;
            padding:4px 4px 4px 11px;
            background:var(--panel-2);
            border:1px solid var(--border);
            border-radius:20px">
    <span style="font-size:12.5px;color:var(--text-2)">{{ request.user.get_full_name|default:request.user.username }}</span>
    {% if request.user.groups.first %}
        <span style="font-size:9.5px;
                     font-weight:600;
                     color:var(--accent);
                     background:var(--accent-soft);
                     padding:2px 7px;
                     border-radius:10px">{{ request.user.groups.first.name|upper }}</span>
    {% endif %}
    <form method="post" action="{% url 'portal:signout' %}" style="margin:0;line-height:1">
        {% csrf_token %}
        <button type="submit"
                title="Sign out"
                style="font-size:12.5px;color:var(--text-3);padding:0 4px;background:none;border:none;cursor:pointer">⏻</button>
    </form>
</div>
